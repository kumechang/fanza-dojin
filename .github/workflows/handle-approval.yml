# 承認用Issueへの「承認」/「却下」コメントを検知し、承認ならXへ画像スレッド投稿する。
name: Handle Approval

on:
  issue_comment:
    types: [created]

concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  handle-approval:
    runs-on: ubuntu-latest
    # pending-approvalラベルが無いIssueや、承認/却下と無関係なコメントには反応しない
    # (Issueスレッド内の雑談コメントで無駄に実行されないためのガード)。
    if: >
      contains(github.event.issue.labels.*.name, 'pending-approval') &&
      (contains(github.event.comment.body, '承認') || contains(github.event.comment.body, '却下'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # サンプル画像の検閲(EraX-NSFW, scripts/censor_image.py)で使うモデルファイル(約40MB)を
      # キャッシュする。Hugging Faceからの実行時ダウンロードはキャッシュミス時のみ発生する
      # (Git LFSはこのリポジトリの実行頻度だと帯域無料枠を大きく超過するため不採用)。
      - name: Cache EraX-NSFW model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/erax_nsfw_yolo11m.pt
          key: erax-nsfw-model-v1-medium

      - name: Download EraX-NSFW model (cache miss only)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: python scripts/ensure_erax_model.py

      - name: Smoke-test censorship dependencies
        run: python -c "import ultralytics, PIL; print('ok')"

      - name: Handle approval comment
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCOUNTS_JSON: ${{ secrets.X_ACCOUNTS_JSON }}
        run: npm run handle-approval

      # if: always() — 例えば承認後の画像スレッド投稿が途中で失敗しても、
      # 承認された事実や進捗(thread_tweet_ids等)・post_failedへの状態遷移はコミットして残す
      # (これが無いと、DB上は承認前のままになり「既に処理済み」判定もできず、
      # 承認コメントをもう一度書いても状況が変わらないまま失敗を繰り返すことになる)。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after approval run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
