# 投稿候補プール(fanza_candidates)を定期的に更新するバッチ処理。
# FANZA ItemList APIから同人ジャンルの値引き中コミックを取得してプールへ反映し、
# 黒塗り要否(EraX-NSFWによる検閲解析、redaction_ratio)がまだ未判定の候補を解析する。
#
# これをgenerate-posts(投稿タイミング)から切り離すことで、投稿時はこのプールを参照する
# だけになり、投稿ごとのFANZA API呼び出し・候補走査分のYOLO推論が不要になる。
# generate-postsはプールの中から、ページ単位の黒塗り判定(config/app.jsonのfanza.
# maxPageRedactionRatio/maxUnpostablePageRatio、src/fanza/redactionPolicy.ts)で
# 投稿可能と判定された候補だけを選ぶ。
name: Fetch Candidate Pool

on:
  workflow_dispatch: {}

# generate-posts.yml / handle-approval.ymlと同じグループ名を共有し、data/app.dbへの
# 書き込みが競合しないよう直列化する。
concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install censorship dependencies
        run: pip install -r requirements.txt

      - name: Cache EraX-NSFW model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/erax_nsfw_yolo11m.pt
          key: erax-nsfw-model-v1-medium

      - name: Download EraX-NSFW model (cache miss only)
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: python scripts/ensure_erax_model.py

      - name: Smoke-test censorship dependencies
        run: python -c "import ultralytics, PIL, numpy; print('ok')"

      - name: Fetch and analyze candidate pool
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
        run: npm run fetch-candidates

      # SQLiteは外部ホスティングせずリポジトリに置いているため、実行後の状態をbotコミットで戻す。
      # if: always() — 前段が失敗した場合でも、そこまでのDB変更(取得済み分・解析済み分)は
      # 失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after fetch-candidates run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
