# 投稿可能時間帯(config/app.jsonのpostingWindow、既定JST 7時〜翌2時、日をまたぐ)の間、
# 30分おきに起動してFANZAの値引き中×人気の高い同人コミックを1件選び、投稿候補を生成する
# (approvalMode: autoの場合はその場で投稿まで行う)。
#
# 実際に生成するかどうかはshouldGenerateNow(src/pipeline/shouldGenerateNow.ts)が
# 1日の目標投稿数・直近投稿からの間隔・時間帯の重みをもとに判断するため、30分おきに
# 起動してもFANZA API呼び出しは目標水準(targetPostsPerDay)に保たれる。
#
# GitHub Actionsの`schedule`トリガーは実測で30分間隔の設定に対し実際は5〜6時間に1回
# 程度しか発火しないという著しい遅延が確認されたため(GitHub側の既知の制限で、間隔を
# 短くしても改善しない)、`schedule`は使わず外部のcron-job.orgから30分おきに
# `workflow_dispatch` APIを叩いてもらう方式に変更した。投稿可能時間帯の判定は
# ワークフロー側ではなくアプリ側(isWithinPostingWindow)で行うため、cron-job.org側は
# 24時間365日一定間隔で叩くだけでよい(時間帯を気にする必要がない)。
name: Generate Posts

on:
  workflow_dispatch: {}

# handle-approval.ymlと同じグループ名を共有し、data/app.dbへの書き込みが競合しないよう直列化する。
concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # approvalMode: "auto"のときだけ、この実行の中でXへの画像投稿(検閲処理を含む)まで
      # 行われる。generate-postsはcron-job.orgから1日約48回起動されるため、manualモード
      # (現在の既定)では毎回Pythonセットアップすると無駄なActions分数を消費する。autoのときだけセットアップする。
      - id: check-mode
        run: echo "mode=$(jq -r .approvalMode config/app.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check-mode.outputs.mode == 'auto'
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install censorship dependencies
        if: steps.check-mode.outputs.mode == 'auto'
        run: pip install -r requirements.txt

      - name: Cache EraX-NSFW model
        id: cache-model
        if: steps.check-mode.outputs.mode == 'auto'
        uses: actions/cache@v4
        with:
          path: models/erax_nsfw_yolo11m.pt
          key: erax-nsfw-model-v1-medium

      - name: Download EraX-NSFW model (cache miss only)
        if: steps.check-mode.outputs.mode == 'auto' && steps.cache-model.outputs.cache-hit != 'true'
        run: python scripts/ensure_erax_model.py

      - name: Smoke-test censorship dependencies
        if: steps.check-mode.outputs.mode == 'auto'
        run: python -c "import ultralytics, PIL; print('ok')"

      - name: Generate candidate post
        env:
          FANZA_API_ID: ${{ secrets.FANZA_API_ID }}
          FANZA_AFFILIATE_ID: ${{ secrets.FANZA_AFFILIATE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCOUNTS_JSON: ${{ secrets.X_ACCOUNTS_JSON }}
        run: npm run generate

      # SQLiteは外部ホスティングせずリポジトリに置いているため、実行後の状態をbotコミットで戻す。
      # concurrencyグループに加えてpull --rebaseのリトライも入れ、二重の備えで競合を防ぐ。
      # if: always() — 前段が失敗した場合でも、そこまでのDB変更は失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after generate run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
