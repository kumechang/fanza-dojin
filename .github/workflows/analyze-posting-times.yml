# 週1回、投稿ごとのエンゲージメント実績を時間帯別に集計してClaudeに分析させ、
# posting_time_weights を更新する。shouldGenerateNow(生成パイプライン)がこの重みを
# 参照し、反応の良い時間帯を優先して投稿候補を作るようになる。
#
# 主経路は外部のcron-job.orgから週1回`workflow_dispatch` APIを叩いてもらう方式(README参照)。
# GitHub Actionsの`schedule`は30分間隔のGenerate Postsだと実測5〜6時間遅延して実用にならなかったが、
# 本ワークフローは週1回で数時間の遅延は無視できるため、cron-job.org側の設定漏れ・失敗時の
# フォールバックとして`schedule`も残す(実測で本ワークフローは移行後一度も実行された形跡が
# なかったため、二重化した)。
name: Analyze Posting Times

on:
  schedule:
    # 毎週日曜 JST 09:37 (UTC 00:37) — cron-job.org側の設定漏れ・失敗時のフォールバック
    - cron: "37 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Analyze posting times
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run analyze-posting-times

      # if: always() — 前段が失敗した場合でも、そこまでのDB変更は失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after posting-time analysis [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
